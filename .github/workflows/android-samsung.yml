name: Android Release (Samsung)

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'lib/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/android-samsung.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Read version from pubspec
        id: ver
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Configure release signing
        working-directory: android
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > livebridge.jks
          {
            echo "storeFile=livebridge.jks"
            echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}"
            echo "keyAlias=${{ secrets.KEY_ALIAS }}"
            echo "keyPassword=${{ secrets.KEY_PASSWORD }}"
          } > key.properties

      - run: flutter pub get

      - name: Build signed release APK
        run: flutter build apk --release

      - name: Determine release tag
        id: tag
        run: |
          TAG="v${{ steps.ver.outputs.version }}-samsung"
          if git ls-remote --tags origin | grep -q "refs/tags/${TAG}$"; then
            TAG="${TAG}-r${{ github.run_number }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Stage APK artifact
        run: cp build/app/outputs/flutter-apk/app-release.apk "LiveBridge-samsung-v${{ steps.ver.outputs.version }}.apk"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: LiveBridge Samsung v${{ steps.ver.outputs.version }}
          body: |
            自编译三星版（Spottq/livebridge fork），自有 keystore 签名。
            源码提交: ${{ github.sha }}
          files: LiveBridge-samsung-*.apk
